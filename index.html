<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아르떼조명 고객 질문 정리</title>
<style>
:root{
  --bg:#fafaf8;--white:#fff;--bd:#e8e6e0;--bd-lt:#f0ede7;
  --tx:#1a1a18;--sub:#6b6860;--muted:#9a9890;--acc:#b8a88a;--acc-lt:#f5f0e8;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{font-family:'Apple SD Gothic Neo','Pretendard','Noto Sans KR',sans-serif;background:var(--bg);color:var(--tx);line-height:1.65}

/* header */
.hd{background:var(--white);border-bottom:1px solid var(--bd);padding:16px 32px;position:sticky;top:0;z-index:200}
.hd-inner{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo{width:32px;height:32px;border-radius:7px;background:#2a2520;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#f0c87a;flex-shrink:0}
.hd-title{font-size:16px;font-weight:700}
.hd-sub{font-size:11px;color:var(--sub);margin-top:1px}
.hd-tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.hd-btn{border:1px solid var(--bd);border-radius:6px;padding:5px 12px;font-size:11px;font-weight:500;background:var(--white);color:var(--sub);cursor:pointer;white-space:nowrap;transition:all .15s}
.hd-btn:hover{border-color:var(--acc);color:var(--tx)}
.hd-btn.green{background:#edf8f3;color:#0e6640;border-color:#a0d8bc}
.hd-btn.blue{background:#edf4ff;color:#1a4f8c;border-color:#b8d0ee}
.hd-btn.red{background:#fff0f0;color:#8c2020;border-color:#e8b8b8}

/* search */
.sw{max-width:1080px;margin:16px auto 0;padding:0 32px}
.si{width:100%;border:1px solid var(--bd);border-radius:8px;padding:10px 14px;font-size:13px;background:var(--white);color:var(--tx);outline:none;transition:border-color .15s}
.si:focus{border-color:var(--acc)}
.si::placeholder{color:var(--muted)}

/* top filter */
.fb{max-width:1080px;margin:10px auto 0;padding:0 32px;display:flex;gap:5px;flex-wrap:wrap}
.fb-btn{border:1px solid var(--bd);border-radius:20px;padding:5px 13px;font-size:12px;font-weight:500;background:var(--white);color:var(--sub);cursor:pointer;transition:all .15s;white-space:nowrap}
.fb-btn:hover{border-color:var(--acc);color:var(--tx)}
.fb-btn.on{background:var(--tx);color:var(--white);border-color:var(--tx)}

/* main */
.main{max-width:1080px;margin:18px auto 60px;padding:0 32px}
.no-result{text-align:center;padding:40px 0;color:var(--muted);font-size:13px;display:none}

/* section head */
.sh{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:8px;border-bottom:1.5px solid var(--bd);margin-top:28px}
.sh:first-child{margin-top:0}
.sh-title{font-size:13px;font-weight:600;flex:1}
.sh-add{border:1px solid var(--bd);border-radius:6px;padding:3px 10px;font-size:11px;background:var(--white);color:var(--sub);cursor:pointer;white-space:nowrap;transition:all .15s}
.sh-add:hover{border-color:#0e6640;color:#0e6640;background:#edf8f3}

/* card grid */
.card-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:4px}

/* card */
.card{background:var(--white);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;transition:border-color .15s}
.card:hover{border-color:var(--acc)}
.card.hidden{display:none}
.card-num{font-size:11px;color:var(--muted);font-weight:600;min-width:20px;padding-top:2px;flex-shrink:0}
.card-body{flex:1;min-width:0}
.card-q{font-size:13px;font-weight:500;color:var(--tx);line-height:1.55;margin-bottom:5px}
.card-a{font-size:12px;color:var(--sub);line-height:1.6}
.card-a em{color:var(--tx);font-style:normal;font-weight:500}
.card-foot{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}

/* badges */
.badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;white-space:nowrap;border:1px solid transparent}
.b-sch{background:#fff8ed;color:#8c5a10;border-color:#e8cfaa}
.b-est{background:#edf4ff;color:#1a4f8c;border-color:#b8d0ee}
.b-prod{background:#fff4ee;color:#7a3010;border-color:#e8c8b0}
.b-pay{background:#edf8f3;color:#0e6640;border-color:#a0d8bc}
.b-can{background:#f3f0ff;color:#4a3a9e;border-color:#c8c0ee}
.b-as{background:#fff0f0;color:#8c2020;border-color:#e8b8b8}
.b-how{background:#eefaf5;color:#0d5c3a;border-color:#90d4b8}
.b-rev{background:#f0f7ee;color:#2e6028;border-color:#aed0a8}
.b-doc{background:#fdf0f7;color:#7a2060;border-color:#ddb0cc}
.b-ment{background:#e8f4fd;color:#0a5a8a;border-color:#8cc8ee}
.b-greet{background:#e8f0fe;color:#1a4f8c;border-color:#b8d0ee}
.b-emp{background:#fdf0f7;color:#7a2060;border-color:#ddb0cc}
.b-ptip{background:#fff4ee;color:#7a3010;border-color:#e8c8b0}
.b-price{background:#edf8f3;color:#0e6640;border-color:#a0d8bc}
.b-sched{background:#fff8ed;color:#8c5a10;border-color:#e8cfaa}
.b-comp{background:#fff0f0;color:#8c2020;border-color:#e8b8b8}
.b-ref{background:#f3f0ff;color:#4a3a9e;border-color:#c8c0ee}
.b-close{background:#f0f7ee;color:#2e6028;border-color:#aed0a8}
.b-cons{background:#eefaf5;color:#0d5c3a;border-color:#90d4b8}
.b-urg{background:#fdf0f7;color:#7a2060;border-color:#e8b8b8}
.b-manual{background:#f0f0f0;color:#444;border-color:#c8c8c8}
.b-manual-claim{background:#fff0ee;color:#7a2010;border-color:#e8c0b8}

/* action btns */
.copy-btn,.edit-btn,.del-btn{border:1px solid var(--bd);border-radius:6px;padding:3px 9px;font-size:11px;background:var(--white);color:var(--sub);cursor:pointer;transition:all .15s;white-space:nowrap}
.copy-btn:hover{border-color:var(--acc);color:var(--tx)}
.copy-btn.done{border-color:#0e6640;color:#0e6640;background:#edf8f3}
.edit-btn:hover{border-color:#1a4f8c;color:#1a4f8c;background:#edf4ff}
.del-btn:hover{border-color:#8c2020;color:#8c2020;background:#fff0f0}

/* ment */
.mcat-bar{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.mcat-btn{border:1px solid var(--bd);border-radius:20px;padding:4px 11px;font-size:11px;font-weight:500;background:var(--white);color:var(--sub);cursor:pointer;transition:all .15s;white-space:nowrap}
.mcat-btn:hover{border-color:var(--acc);color:var(--tx)}
.mcat-btn.on{background:var(--tx);color:var(--white);border-color:var(--tx)}
.msrow{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.msi{flex:1;border:1px solid var(--bd);border-radius:8px;padding:8px 12px;font-size:13px;background:var(--white);color:var(--tx);outline:none;transition:border-color .15s}
.msi:focus{border-color:var(--acc)}
.msi::placeholder{color:var(--muted)}
.mcnt{font-size:11px;color:var(--muted);white-space:nowrap}

/* ── Modal ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--white);border-radius:14px;padding:24px 28px;width:min(560px,92vw);max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.18)}
.modal h3{font-size:15px;font-weight:700;margin-bottom:18px}
.modal label{font-size:12px;font-weight:600;color:var(--sub);display:block;margin-bottom:4px;margin-top:14px}
.modal label:first-of-type{margin-top:0}
.modal input,.modal textarea,.modal select{width:100%;border:1px solid var(--bd);border-radius:7px;padding:8px 10px;font-size:13px;font-family:inherit;color:var(--tx);background:var(--white);outline:none;transition:border-color .15s;resize:vertical}
.modal input:focus,.modal textarea:focus,.modal select:focus{border-color:var(--acc)}
.modal textarea{min-height:80px}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.modal-btns button{border:1px solid var(--bd);border-radius:7px;padding:7px 18px;font-size:13px;cursor:pointer;transition:all .15s;font-weight:500}
.btn-cancel{background:var(--white);color:var(--sub)}
.btn-cancel:hover{border-color:var(--acc)}
.btn-save{background:#2a2520;color:var(--white);border-color:#2a2520}
.btn-save:hover{background:#444}

/* toast */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:#2a2520;color:#fff;font-size:12px;padding:9px 20px;border-radius:20px;opacity:0;transition:all .3s;z-index:999;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── 상세 패널 ── */
.detail-toggle{border:1px solid var(--bd);border-radius:6px;padding:3px 9px;font-size:11px;background:#f5f0e8;color:#8c5a10;border-color:#e8cfaa;cursor:pointer;transition:all .15s;white-space:nowrap}
.detail-toggle:hover{background:#e8cfaa;color:#5a3008}
.detail-toggle.open{background:#2a2520;color:#fff;border-color:#2a2520}
.detail-panel{display:none;margin-top:10px;padding:14px 16px;background:#faf8f4;border-radius:8px;border:1px solid #e8e0d0;font-size:12.5px;color:#4a4840;line-height:1.7}
.detail-panel.open{display:block;animation:dp-fade .2s ease}
@keyframes dp-fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.detail-panel p{margin-bottom:8px}
.detail-panel p:last-child{margin-bottom:0}
.detail-panel strong{color:#1a1a18;font-weight:600}
.detail-panel ul{margin:6px 0 10px;padding-left:0;list-style:none}
.detail-panel li{position:relative;padding-left:16px;margin-bottom:5px}
.detail-panel li::before{content:"";position:absolute;left:2px;top:8px;width:5px;height:5px;border-radius:50%;background:#b8a88a}
.detail-panel table{width:100%;border-collapse:collapse;margin:8px 0;font-size:12px}
.detail-panel th,.detail-panel td{text-align:left;padding:7px 10px;border-bottom:1px solid #e8e0d0}
.detail-panel th{background:#f0ede7;font-weight:700;color:#1a1a18;font-size:11.5px}
.detail-panel td{color:#4a4840}
.detail-panel tr:last-child td{border-bottom:none}
.detail-panel .note{border-radius:7px;padding:10px 12px;margin:8px 0;font-size:12px;display:flex;gap:8px;align-items:flex-start}
.detail-panel .note.warn{background:#fff0f0;color:#7d2530;border:1px solid #e8c0c0}
.detail-panel .note.tip{background:#eefaf5;color:#1a4f44;border:1px solid #a0d8bc}
.detail-panel .note-icon{flex-shrink:0;font-weight:800;font-size:13px;line-height:1.5}
.detail-label{font-size:10px;font-weight:700;color:#8c5a10;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;display:block}

@media(max-width:640px){.hd,.sw,.fb,.main{padding-left:12px;padding-right:12px}}
</style>
</head>
<body>

<!-- Header -->
<div class="hd">
  <div class="hd-inner">
    <div class="logo">AR</div>
    <div>
      <div class="hd-title">아르떼조명 고객 질문 정리</div>
      <div class="hd-sub">자주 묻는 질문 FAQ · 상담 멘트 모음</div>
    </div>
    <div class="hd-tools">
      <button class="hd-btn green" id="btnExport">💾 백업 저장</button>
      <button class="hd-btn blue"  id="btnImport">📂 백업 불러오기</button>
      <input type="file" id="fileInput" accept=".json" style="display:none">
    </div>
  </div>
</div>

<!-- Search -->
<div class="sw"><input class="si" id="gSearch" type="text" placeholder="전체 검색 (질문·답변·멘트 내용)…"></div>

<!-- Top filter -->
<div class="fb" id="topFilter">
  <button class="fb-btn on" data-sec="all">전체</button>
  <button class="fb-btn" data-sec="sch">시공 일정</button>
  <button class="fb-btn" data-sec="est">비용·견적</button>
  <button class="fb-btn" data-sec="prod">제품·구성</button>
  <button class="fb-btn" data-sec="pay">결제·입금</button>
  <button class="fb-btn" data-sec="can">취소·환불</button>
  <button class="fb-btn" data-sec="as">AS·하자</button>
  <button class="fb-btn" data-sec="how">사용·설치</button>
  <button class="fb-btn" data-sec="rev">후기·이벤트</button>
  <button class="fb-btn" data-sec="doc">서류·계약서</button>
  <button class="fb-btn" data-sec="ment">💬 상담 멘트</button>
</div>

<div class="main">
<div class="no-result" id="noResult">검색 결과가 없습니다.</div>

<!-- FAQ 섹션 -->
<div id="faqArea">
  <div class="faq-sec" data-sec="sch"><div class="sh"><span class="badge b-sch">시공 일정</span><span class="sh-title">설치·방문 일정 / 날짜</span><button class="sh-add" data-sec="sch">+ 항목 추가</button></div><div class="card-grid" id="cg-sch"></div></div>
  <div class="faq-sec" data-sec="est"><div class="sh"><span class="badge b-est">비용·견적</span><span class="sh-title">비용 · 견적 · 할인 · 이벤트</span><button class="sh-add" data-sec="est">+ 항목 추가</button></div><div class="card-grid" id="cg-est"></div></div>
  <div class="faq-sec" data-sec="prod"><div class="sh"><span class="badge b-prod">제품·구성</span><span class="sh-title">부품 / 등기구 교체 · 구성</span><button class="sh-add" data-sec="prod">+ 항목 추가</button></div><div class="card-grid" id="cg-prod"></div></div>
  <div class="faq-sec" data-sec="pay"><div class="sh"><span class="badge b-pay">결제·입금</span><span class="sh-title">주문 · 결제 · 입금</span><button class="sh-add" data-sec="pay">+ 항목 추가</button></div><div class="card-grid" id="cg-pay"></div></div>
  <div class="faq-sec" data-sec="can"><div class="sh"><span class="badge b-can">취소·환불</span><span class="sh-title">교환 · 환불 · 반품 · 취소</span><button class="sh-add" data-sec="can">+ 항목 추가</button></div><div class="card-grid" id="cg-can"></div></div>
  <div class="faq-sec" data-sec="as"><div class="sh"><span class="badge b-as">AS·하자</span><span class="sh-title">A/S 접수 · 하자보수</span><button class="sh-add" data-sec="as">+ 항목 추가</button></div><div class="card-grid" id="cg-as"></div></div>
  <div class="faq-sec" data-sec="how"><div class="sh"><span class="badge b-how">사용·설치</span><span class="sh-title">설치 / 사용 방법 문의</span><button class="sh-add" data-sec="how">+ 항목 추가</button></div><div class="card-grid" id="cg-how"></div></div>
  <div class="faq-sec" data-sec="rev"><div class="sh"><span class="badge b-rev">후기·이벤트</span><span class="sh-title">후기 · 할인 · 이벤트</span><button class="sh-add" data-sec="rev">+ 항목 추가</button></div><div class="card-grid" id="cg-rev"></div></div>
  <div class="faq-sec" data-sec="doc"><div class="sh"><span class="badge b-doc">서류</span><span class="sh-title">서류 · 계약서 · 보증서 · 세금계산서</span><button class="sh-add" data-sec="doc">+ 항목 추가</button></div><div class="card-grid" id="cg-doc"></div></div>
</div>

<!-- 상담 멘트 -->
<div id="mentArea">
  <div class="sh"><span class="badge b-ment">💬 상담 멘트</span><span class="sh-title">고객 상담 시 활용 메시지 100선</span><button class="sh-add" data-sec="ment">+ 멘트 추가</button></div>
  <div class="msrow">
    <input class="msi" id="mSearch" type="text" placeholder="멘트 검색…">
    <span class="mcnt" id="mCnt">100개</span>
  </div>
  <div class="mcat-bar" id="mcatBar">
    <button class="mcat-btn on" data-mc="all">전체</button>
    <button class="mcat-btn" data-mc="greet">첫 인사·환영</button>
    <button class="mcat-btn" data-mc="emp">공감·경청</button>
    <button class="mcat-btn" data-mc="ptip">제품·기술 안내</button>
    <button class="mcat-btn" data-mc="price">견적·가격 안내</button>
    <button class="mcat-btn" data-mc="sched">일정·납기 안내</button>
    <button class="mcat-btn" data-mc="comp">불만·컴플레인</button>
    <button class="mcat-btn" data-mc="ref">완곡한 거절</button>
    <button class="mcat-btn" data-mc="close">마무리·사후관리</button>
    <button class="mcat-btn" data-mc="cons">전문 컨설팅</button>
    <button class="mcat-btn" data-mc="urg">긴급·특수 상황</button>
    <button class="mcat-btn" data-mc="manual_prod" style="border-color:#c8c8c8;color:#555">📋 매뉴얼_제품사양</button>
    <button class="mcat-btn" data-mc="manual_price" style="border-color:#c8c8c8;color:#555">📋 매뉴얼_가격비용</button>
    <button class="mcat-btn" data-mc="manual_as" style="border-color:#c8c8c8;color:#555">📋 매뉴얼_AS하자</button>
    <button class="mcat-btn" data-mc="manual_proc" style="border-color:#c8c8c8;color:#555">📋 매뉴얼_시공일정</button>
    <button class="mcat-btn" data-mc="manual_claim" style="border-color:#e8c0b8;color:#7a2010">📋 매뉴얼_클레임</button>
  </div>
  <div class="card-grid" id="mentGrid"></div>
</div>

</div><!-- /main -->

<!-- Edit Modal -->
<div class="modal-bg" id="editModal">
  <div class="modal">
    <h3 id="modalTitle">항목 수정</h3>
    <label id="lblSec">카테고리</label>
    <select id="modalSec">
      <option value="sch">시공 일정</option>
      <option value="est">비용·견적</option>
      <option value="prod">제품·구성</option>
      <option value="pay">결제·입금</option>
      <option value="can">취소·환불</option>
      <option value="as">AS·하자</option>
      <option value="how">사용·설치</option>
      <option value="rev">후기·이벤트</option>
      <option value="doc">서류·계약서</option>
    </select>
    <div id="mentCatRow">
      <label>멘트 카테고리</label>
      <select id="modalMc">
        <option value="greet">첫 인사·환영</option>
        <option value="emp">공감·경청</option>
        <option value="ptip">제품·기술 안내</option>
        <option value="price">견적·가격 안내</option>
        <option value="sched">일정·납기 안내</option>
        <option value="comp">불만·컴플레인</option>
        <option value="ref">완곡한 거절</option>
        <option value="close">마무리·사후관리</option>
        <option value="cons">전문 컨설팅</option>
        <option value="urg">긴급·특수 상황</option>
        <option value="manual_prod">📋 매뉴얼_제품사양</option>
        <option value="manual_price">📋 매뉴얼_가격비용</option>
        <option value="manual_as">📋 매뉴얼_AS하자</option>
        <option value="manual_proc">📋 매뉴얼_시공일정</option>
        <option value="manual_claim">📋 매뉴얼_클레임</option>
      </select>
    </div>
    <label id="lblQ">질문</label>
    <textarea id="modalQ" rows="2" placeholder="질문 내용을 입력하세요"></textarea>
    <div id="answerRow">
      <label>답변</label>
      <textarea id="modalA" rows="3" placeholder="답변 내용을 입력하세요 (em 태그로 강조: <em>강조어</em>)"></textarea>
    </div>
    <div class="modal-btns">

  {mc:"manual_price",t:"[가격] 코타라 완납(선납) 이유: 인터넷 기준 60만원 중반대 상품을 54만원으로 공급하기 위함. 박람회에서 10만원 차이 설명 후 시공 확정 시 완납 수령."},
  {mc:"manual_price",t:"[가격] 군산 옵션세대 욕실센서 2개 → 매입등 6개 또는 우물 한 줄 추가 변경 가능. 정상가 26만원이나 추가 6만원만 부담."},
  {mc:"manual_price",t:"[가격] 커튼박스 가격: 11만원으로 변경됨."},
  {mc:"manual_price",t:"[가격] 추가 할인 요청 대응: 임의 판단 불가 — 대표님 확인 사항. 1차: 냉장고장 2구 등 사은품 제안. 취소 우려 건은 우선순위 신속 연락."},
  {mc:"manual_as",t:"[AS] 실링팬 설치 후 화재감지기 오작동: 실링팬 직접 원인 아님. 광전식 감지기는 먼지에 취약 → 클리닝 우선 권장. 청소 후 지속 시 신규 모델 교체 권장."},
  {mc:"manual_as",t:"[AS] 실링팬 완전 차단 방법: L2(거실·침실1) 차단기를 내렸다가 10분 이상 후 올리면 메모리 리셋. 바로 올리면 이전 설정 재작동."},

  {mc:"manual_as",t:"[AS] 루씨에어 AS 접수·발주: as.ubob.biz (USSOFT A/S). 담당자 02-2088-8829. 최초 이용 시 전화로 원격 설치 요청."},
  {mc:"manual_as",t:"[AS] 우물천장 도배 찢어짐 하자: 도배 시 한쪽 면 막힌 상태로 마감 후 실링팬 설치 시 해당 면 오려냄으로 발생. 도배사 방문 보수 조치. 시공팀·도배사 간 작업 순서 확인 필요."},

  {mc:"manual_proc",t:"[시공] 복도 2구 무상 서비스 기준: 옵션행사(25/9/5~7) 원칙상 미적용. 본행사(26/2/7~8) 계약 무관 전원 무상. 예외: 옵션행사 착오 계약자 전원에게 추가 적용."},
  {mc:"manual_proc",t:"[시공] 실링팬 미출고 세대: CS업무방 시즌2 자료 기준 빨간색 표시 세대는 3월 5일 마감 예정."},
  {mc:"manual_proc",t:"[시공] (군산) 세대 비밀번호: 절대 입주민 오픈 불가. 이사 3일 전 또는 잔금 납부 이전 입주민 동반 방문 불가. 주관사 보유 세대는 요청 시 확인 가능."},
  {mc:"manual_claim",t:"[클레임] 일당 보상 요구 대응: 임의 판단 불가, 대표님 확인 후 처리. 강성 클레임(블로그·카페 압박 등) 반드시 대표님 전달. 환불: 아르떼 계약금→아르떼 직접 환불, 나머지→주관사 환불."},
  {mc:"manual_claim",t:"[클레임] 검단호반 3차 문의: 금액·도면은 옥화 실장님께 먼저 확인 후 안내. 임의 견적 불가. 시티오씨엘 6단지(299만원)는 무몰딩 기준 아님—구성 달라 동일 비교 어렵다고 안내."},
];

// ═══════════════════════════════════════════════════
// 유틸
// ═══════════════════════════════════════════════════
const secLabel = {sch:'시공 일정',est:'비용·견적',prod:'제품·구성',pay:'결제·입금',can:'취소·환불',as:'AS·하자',how:'사용·설치',rev:'후기·이벤트',doc:'서류'};
const secBadge = {sch:'b-sch',est:'b-est',prod:'b-prod',pay:'b-pay',can:'b-can',as:'b-as',how:'b-how',rev:'b-rev',doc:'b-doc'};
const mcLabel  = {greet:'첫 인사',emp:'공감·경청',ptip:'제품 안내',price:'가격 안내',sched:'일정 안내',comp:'컴플레인',ref:'거절 안내',close:'마무리',cons:'컨설팅',urg:'긴급 상황',manual_prod:'매뉴얼_제품',manual_price:'매뉴얼_가격',manual_as:'매뉴얼_AS',manual_proc:'매뉴얼_시공',manual_claim:'매뉴얼_클레임'};
const mcBadge  = {greet:'b-greet',emp:'b-emp',ptip:'b-ptip',price:'b-price',sched:'b-sched',comp:'b-comp',ref:'b-ref',close:'b-close',cons:'b-cons',urg:'b-urg',manual_prod:'b-manual',manual_price:'b-manual',manual_as:'b-manual',manual_proc:'b-manual',manual_claim:'b-manual-claim'};

function stripTags(s){ return s.replace(/<[^>]+>/g,''); }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function doCopy(btn, text){
  const plain = stripTags(text);
  const done = ()=>{
    btn.textContent='✅ 복사됨'; btn.classList.add('done');
    setTimeout(()=>{ btn.textContent='📋 복사'; btn.classList.remove('done'); },1800);
  };
  if(navigator.clipboard){
    navigator.clipboard.writeText(plain).then(done).catch(()=>legacyCopy(plain,done));
  } else { legacyCopy(plain,done); }
}
function legacyCopy(text,cb){
  const ta=document.createElement('textarea');
  ta.value=text; ta.style.cssText='position:fixed;top:-999px;left:-999px;opacity:0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta); cb();
}

// ═══════════════════════════════════════════════════
// 카드 렌더
// ═══════════════════════════════════════════════════
function makeCard(type, sec, idx){
  const div = document.createElement('div');
  div.className = 'card';

  if(type==='faq'){
    const item = FAQ[sec][idx];
    div.dataset.sec = sec;
    div.dataset.search = (item.q+' '+stripTags(item.a)).toLowerCase();
    const copyText = item.q+'\nA. '+stripTags(item.a);

    const num = document.createElement('div'); num.className='card-num'; num.textContent=idx+1;
    const body = document.createElement('div'); body.className='card-body';
    const q = document.createElement('div'); q.className='card-q'; q.textContent=item.q;
    const a = document.createElement('div'); a.className='card-a'; a.innerHTML='A. '+item.a;
    const foot = document.createElement('div'); foot.className='card-foot';

    const badge = document.createElement('span'); badge.className='badge '+secBadge[sec]; badge.textContent=secLabel[sec];
    const btnCopy = document.createElement('button'); btnCopy.className='copy-btn'; btnCopy.textContent='📋 복사'; btnCopy.setAttribute('data-copy',copyText);
    const btnEdit = document.createElement('button'); btnEdit.className='edit-btn'; btnEdit.textContent='✏️ 수정'; btnEdit.onclick=()=>openEdit('faq',sec,idx);
    const btnDel  = document.createElement('button'); btnDel.className='del-btn';  btnDel.textContent='🗑 삭제';  btnDel.onclick=()=>deleteItem('faq',sec,idx);

    foot.append(badge, btnCopy, btnEdit, btnDel);

    // 상세 패널
    const detailKey = sec+'_'+idx;
    const detailHTML = DETAIL[detailKey];
    if(detailHTML){
      const btnDetail = document.createElement('button');
      btnDetail.className='detail-toggle'; btnDetail.textContent='📖 상세 보기';
      const panel = document.createElement('div');
      panel.className='detail-panel'; panel.innerHTML=detailHTML;
      btnDetail.onclick=()=>{
        const isOpen = panel.classList.toggle('open');
        btnDetail.classList.toggle('open', isOpen);
        btnDetail.textContent = isOpen ? '📖 상세 닫기' : '📖 상세 보기';
      };
      foot.append(btnDetail);
      body.append(q, a, foot, panel);
    } else {
      body.append(q, a, foot);
    }

    div.append(num, body);

  } else {
    const item = MENTS[idx];
    div.dataset.mc = item.mc;
    div.dataset.search = item.t.toLowerCase();

    const num = document.createElement('div'); num.className='card-num'; num.textContent=idx+1;
    const body = document.createElement('div'); body.className='card-body';
    const q = document.createElement('div'); q.className='card-q'; q.textContent=item.t;
    const foot = document.createElement('div'); foot.className='card-foot';

    const badge = document.createElement('span'); badge.className='badge '+mcBadge[item.mc]; badge.textContent=mcLabel[item.mc];
    const btnCopy = document.createElement('button'); btnCopy.className='copy-btn'; btnCopy.textContent='📋 복사'; btnCopy.setAttribute('data-copy',item.t);
    const btnEdit = document.createElement('button'); btnEdit.className='edit-btn'; btnEdit.textContent='✏️ 수정'; btnEdit.onclick=()=>openEdit('ment',null,idx);
    const btnDel  = document.createElement('button'); btnDel.className='del-btn';  btnDel.textContent='🗑 삭제';  btnDel.onclick=()=>deleteItem('ment',null,idx);

    foot.append(badge, btnCopy, btnEdit, btnDel);
    body.append(q, foot);
    div.append(num, body);
  }
  return div;
}

function renderAll(){
  // FAQ
  Object.keys(FAQ).forEach(sec=>{
    const grid = document.getElementById('cg-'+sec);
    grid.innerHTML='';
    FAQ[sec].forEach((_,i)=> grid.appendChild(makeCard('faq',sec,i)));
  });
  // MENTS
  const mg = document.getElementById('mentGrid');
  mg.innerHTML='';
  MENTS.forEach((_,i)=> mg.appendChild(makeCard('ment',null,i)));
  applyFilter();
}

// ═══════════════════════════════════════════════════
// 이벤트 위임: 복사 버튼
// ═══════════════════════════════════════════════════
document.addEventListener('click', e=>{
  const btn = e.target.closest('.copy-btn');
  if(!btn) return;
  e.stopPropagation();
  const text = btn.getAttribute('data-copy');
  if(text) doCopy(btn, text);
});

// ═══════════════════════════════════════════════════
// 삭제
// ═══════════════════════════════════════════════════
function deleteItem(type, sec, idx){
  if(!confirm('이 항목을 삭제할까요?')) return;
  if(type==='faq'){ FAQ[sec].splice(idx,1); }
  else            { MENTS.splice(idx,1); }
  renderAll();
  showToast('삭제되었습니다.');
}

// ═══════════════════════════════════════════════════
// 모달 (추가 / 수정)
// ═══════════════════════════════════════════════════
let modalMode = null; // {type, sec, idx} or {type:'add', sec, isMent}
const modal    = document.getElementById('editModal');
const modalTitle = document.getElementById('modalTitle');
const modalSec   = document.getElementById('modalSec');
const modalMc    = document.getElementById('modalMc');
const modalQ     = document.getElementById('modalQ');
const modalA     = document.getElementById('modalA');
const mentCatRow = document.getElementById('mentCatRow');
const answerRow  = document.getElementById('answerRow');
const lblSec     = document.getElementById('lblSec');
const lblQ       = document.getElementById('lblQ');

function openEdit(type, sec, idx){
  modalMode = {type, sec, idx, action:'edit'};
  if(type==='faq'){
    modalTitle.textContent = 'FAQ 항목 수정';
    lblSec.style.display=''; modalSec.style.display=''; mentCatRow.style.display='none'; answerRow.style.display='';
    lblQ.textContent='질문';
    modalSec.value = sec;
    modalQ.value = FAQ[sec][idx].q;
    modalA.value = FAQ[sec][idx].a;
  } else {
    modalTitle.textContent = '상담 멘트 수정';
    lblSec.style.display='none'; modalSec.style.display='none'; mentCatRow.style.display=''; answerRow.style.display='none';
    lblQ.textContent='멘트 내용';
    modalMc.value = MENTS[idx].mc;
    modalQ.value  = MENTS[idx].t;
  }
  modal.classList.add('open');
}

function openAdd(type, sec){
  modalMode = {type, sec, action:'add'};
  if(type==='faq'){
    modalTitle.textContent = 'FAQ 항목 추가';
    lblSec.style.display=''; modalSec.style.display=''; mentCatRow.style.display='none'; answerRow.style.display='';
    lblQ.textContent='질문';
    modalSec.value = sec; modalQ.value=''; modalA.value='';
  } else {
    modalTitle.textContent = '상담 멘트 추가';
    lblSec.style.display='none'; modalSec.style.display='none'; mentCatRow.style.display=''; answerRow.style.display='none';
    lblQ.textContent='멘트 내용';
    modalMc.value='greet'; modalQ.value='';
  }
  modal.classList.add('open');
}

document.getElementById('modalCancel').onclick = ()=> modal.classList.remove('open');
modal.addEventListener('click', e=>{ if(e.target===modal) modal.classList.remove('open'); });

document.getElementById('modalSave').onclick = ()=>{
  const {type, sec, idx, action} = modalMode;
  if(type==='faq'){
    const newSec = modalSec.value;
    const newQ = modalQ.value.trim();
    const newA = modalA.value.trim();
    if(!newQ||!newA){ alert('질문과 답변을 모두 입력해 주세요.'); return; }
    if(action==='edit'){
      if(newSec !== sec){
        FAQ[sec].splice(idx,1);
        FAQ[newSec].push({q:newQ, a:newA});
      } else {
        FAQ[sec][idx] = {q:newQ, a:newA};
      }
    } else {
      FAQ[newSec].push({q:newQ, a:newA});
    }
  } else {
    const newMc = modalMc.value;
    const newT  = modalQ.value.trim();
    if(!newT){ alert('멘트 내용을 입력해 주세요.'); return; }
    if(action==='edit'){ MENTS[idx] = {mc:newMc, t:newT}; }
    else               { MENTS.push({mc:newMc, t:newT}); }
  }
  modal.classList.remove('open');
  renderAll();
  showToast(action==='edit' ? '수정되었습니다.' : '추가되었습니다.');
};

// + 항목 추가 버튼
document.querySelectorAll('.sh-add').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const sec = btn.dataset.sec;
    openAdd(sec==='ment' ? 'ment' : 'faq', sec==='ment' ? null : sec);
  });
});

// ═══════════════════════════════════════════════════
// JSON 내보내기 / 불러오기
// ═══════════════════════════════════════════════════
document.getElementById('btnExport').onclick = ()=>{
  const data = JSON.stringify({FAQ, MENTS}, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'arte_faq_백업_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  showToast('백업 파일을 저장했습니다.');
};

document.getElementById('btnImport').onclick = ()=> document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = e=>{
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      const data = JSON.parse(ev.target.result);
      if(!data.FAQ || !data.MENTS) throw new Error('형식 오류');
      FAQ   = data.FAQ;
      MENTS = data.MENTS;
      renderAll();
      showToast('백업 불러오기 완료!');
    } catch(err){
      alert('백업 파일 형식이 올바르지 않습니다.\n' + err.message);
    }
    e.target.value='';
  };
  reader.readAsText(file);
};

// ═══════════════════════════════════════════════════
// 필터 / 검색
// ═══════════════════════════════════════════════════
let curSec='all', curMc='all', gSearch='', mSearch='';

function applyFilter(){
  const faqCards  = document.querySelectorAll('#faqArea .card');
  const mentCards = document.querySelectorAll('#mentGrid .card');
  const faqArea   = document.getElementById('faqArea');
  const mentArea  = document.getElementById('mentArea');

  let faqVis=0;
  faqCards.forEach(c=>{
    const ok = (curSec==='all'||curSec==='ment'||c.dataset.sec===curSec)
            && (!gSearch||c.dataset.search.includes(gSearch));
    c.classList.toggle('hidden',!ok);
    if(ok) faqVis++;
  });
  document.querySelectorAll('.faq-sec').forEach(s=>{
    const v = s.querySelectorAll('.card:not(.hidden)').length>0;
    s.style.display = (curSec==='ment') ? 'none' : (v?'':'none');
  });
  faqArea.style.display = (curSec==='ment') ? 'none' : '';

  let mentVis=0;
  mentCards.forEach(c=>{
    const ok = (curMc==='all'||c.dataset.mc===curMc)
            && (!mSearch||c.dataset.search.includes(mSearch))
            && (!gSearch||c.dataset.search.includes(gSearch));
    c.classList.toggle('hidden',!ok);
    if(ok) mentVis++;
  });
  document.getElementById('mCnt').textContent = mentVis+'개';
  mentArea.style.display = (curSec==='all'||curSec==='ment') ? '' : 'none';

  const total = (curSec==='ment'?0:faqVis)+(curSec==='all'||curSec==='ment'?mentVis:0);
  document.getElementById('noResult').style.display = (gSearch&&total===0)?'block':'none';
}

document.querySelectorAll('.fb-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.fb-btn').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on'); curSec=btn.dataset.sec; applyFilter();
  });
});
document.querySelectorAll('.mcat-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.mcat-btn').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on'); curMc=btn.dataset.mc; applyFilter();
  });
});
document.getElementById('gSearch').addEventListener('input',e=>{ gSearch=e.target.value.trim().toLowerCase(); applyFilter(); });
document.getElementById('mSearch').addEventListener('input',e=>{ mSearch=e.target.value.trim().toLowerCase(); applyFilter(); });

// 최초 렌더
renderAll();
</script>
